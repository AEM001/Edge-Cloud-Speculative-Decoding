[project]
name = "speculative-decoding-edge"
version = "0.1.0"
description = "Speculative decoding edge node for Ubuntu 3060 with PyTorch"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
