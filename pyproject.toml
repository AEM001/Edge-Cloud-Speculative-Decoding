[project]
name = "picospec"
version = "1.0.0"
description = "PicoSpec — synchronous and asynchronous speculative decoding toolkit"
requires-python = ">=3.10"
dependencies = [
    "vllm>=0.4.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
